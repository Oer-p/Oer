<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070a">
<title>OER — Status</title>
<style>
:root {
  --bg: #05070a;
  --panel: #0b0f14;
  --panel2: #11161d;
  --panel3: #171d26;
  --border: #1e2630;
  --text: #f1f5f9;
  --muted: #8b97a8;
  --cyan: #00a8e8;
  --cyan-glow: rgba(0, 168, 232, 0.15);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
button, input { font: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 20px 14px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 24px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 13px; background: var(--cyan);
  display: grid; place-items: center; box-shadow: 0 0 20px var(--cyan-glow);
}
.brand-logo svg { width: 24px; height: 24px; }
.brand-name { font-size: 20px; font-weight: 800; }
.brand-tag { font-size: 9px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; }

.nav { display: grid; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px;
  border-radius: 12px; color: var(--muted); font-size: 14px; font-weight: 600;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item:hover { background: var(--panel2); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(0,168,232,0.15), rgba(0,168,232,0.05));
  color: var(--cyan); border: 1px solid rgba(0,168,232,0.2);
}

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 64px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--border);
  background: rgba(11,15,20,0.85); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10;
}
.topbar h1 { font-size: 18px; font-weight: 700; }

.content { max-width: 640px; margin: 0 auto; padding: 28px 20px 80px; width: 100%; }

.stories {
  display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 28px;
}
.story {
  flex: 0 0 auto; width: 72px; text-align: center; font-size: 11px; color: var(--muted);
}
.story-ring {
  width: 64px; height: 64px; border-radius: 50%; padding: 3px; margin: 0 auto 6px;
  background: linear-gradient(135deg, var(--cyan), #0066aa);
}
.story-ring.mine { background: var(--panel3); border: 2px dashed var(--border); padding: 2px; }
.story-inner {
  width: 100%; height: 100%; border-radius: 50%; background: var(--panel2);
  display: grid; place-items: center; overflow: hidden; font-weight: 700; color: var(--cyan);
}
.story-inner img { width: 100%; height: 100%; object-fit: cover; }
.story-add { font-size: 24px; color: var(--cyan); }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.card h2 { font-size: 18px; margin-bottom: 6px; }
.card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: 12px; font-size: 13px; font-weight: 650;
}
.btn-primary { background: var(--cyan); color: #001018; width: 100%; }
.btn-primary:hover { background: #00b8f5; }

.status-list { display: grid; gap: 10px; margin-top: 20px; }
.status-item {
  display: flex; align-items: center; gap: 14px; padding: 14px;
  background: var(--panel2); border-radius: 14px; border: 1px solid var(--border);
}
.avatar {
  width: 48px; height: 48px; border-radius: 50%; background: var(--panel3);
  display: grid; place-items: center; font-weight: 700; color: var(--cyan); flex-shrink: 0;
}
.status-info { min-width: 0; flex: 1; }
.status-info strong { display: block; font-size: 14px; }
.status-info small { font-size: 12px; color: var(--muted); margin-top: 3px; display: block; }

.empty {
  text-align: center; padding: 48px 20px; color: var(--muted);
}
.empty-icon {
  width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%;
  background: var(--panel2); display: grid; place-items: center; font-size: 28px;
}

.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
  background: var(--panel); border-top: 1px solid var(--border);
  grid-template-columns: repeat(4, 1fr); z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 10px; color: var(--muted); font-weight: 600;
}
.bottom-nav a.active { color: var(--cyan); }
.bottom-nav svg { width: 22px; height: 22px; }

.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(10px);
  background: var(--panel3); border: 1px solid var(--border); color: white;
  padding: 12px 18px; border-radius: 12px; font-size: 13px; opacity: 0;
  pointer-events: none; transition: 0.2s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .bottom-nav { display: grid; }
  .content { padding-bottom: 90px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-scroll">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 48 48" fill="none"><path d="M24 6C13.5 6 5 13.1 5 22c0 5.1 2.9 9.7 7.4 12.6L10 42l11-5.1c1 .2 2 .3 3 .3 10.5 0 19-7.1 19-16S34.5 6 24 6Z" fill="white"/></svg>
        </div>
        <div>
          <div class="brand-name">OER</div>
          <div class="brand-tag">Connect Everything</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Beranda</a>
        <a class="nav-item" href="chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>Chat</a>
        <a class="nav-item active" href="status.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg>Status</a>
        <a class="nav-item" href="friends.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Teman</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <header class="topbar"><h1>Status</h1></header>
    <div class="content">
      <div class="stories" id="stories">
        <div class="story" id="addStory">
          <div class="story-ring mine"><div class="story-inner story-add">+</div></div>
          Status saya
        </div>
      </div>

      <div class="card">
        <h2>Bagikan momenmu</h2>
        <p>Status hanya tersimpan di perangkat ini. Untuk dilihat orang lain, OER perlu backend.</p>
        <button class="btn btn-primary" id="createStatus">+ Buat Status</button>
      </div>

      <div class="status-list" id="statusList"></div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Home</a>
  <a href="chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>Chat</a>
  <a href="status.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg>Status</a>
  <a href="friends.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Teman</a>
</nav>

<div class="toast" id="toast"></div>

<script>
const toast = document.getElementById('toast');
let statusItems = [];
let toastTimer;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}
function escapeHTML(v) {
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name) {
  return String(name || 'OER').trim().split(/\s+/).slice(0,2).map(p => p[0]||'').join('').toUpperCase();
}
function loadStatuses() {
  try { statusItems = JSON.parse(localStorage.getItem('oer_status') || '[]'); }
  catch { statusItems = []; }
}
function saveStatuses() {
  try { localStorage.setItem('oer_status', JSON.stringify(statusItems)); }
  catch { showToast('Gagal menyimpan'); }
}
function render() {
  const list = document.getElementById('statusList');
  if (!statusItems.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">◌</div><strong style="color:var(--text)">Belum ada status</strong><p style="margin-top:8px">Buat status pertama kamu.</p></div>`;
    return;
  }
  list.innerHTML = statusItems.map(item => `
    <div class="status-item">
      <div class="avatar">${escapeHTML(initials(item.name))}</div>
      <div class="status-info">
        <strong>${escapeHTML(item.name)}</strong>
        <small>${escapeHTML(item.text)}</small>
      </div>
    </div>
  `).join('');
}
function createStatus() {
  const text = prompt('Tulis status kamu:');
  if (!text?.trim()) return;
  let profile = {};
  try { profile = JSON.parse(localStorage.getItem('oer_profile') || '{}'); } catch {}
  statusItems.unshift({
    id: String(Date.now()),
    name: profile.name || 'Saya',
    text: text.trim(),
    time: new Date().toLocaleString('id-ID')
  });
  saveStatuses();
  render();
  showToast('Status ditambahkan');
}
document.getElementById('createStatus').onclick = createStatus;
document.getElementById('addStory').onclick = createStatus;
loadStatuses();
render();
</script>
</body>
</html>
