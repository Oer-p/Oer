
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0d">
<meta name="description" content="OER Chat - ruang percakapan modern">
<title>OER — Chat</title>

<style>
:root {
  --bg: #080a0d;
  --panel: #0d1015;
  --panel2: #141820;
  --panel3: #1d232d;
  --border: #252b35;
  --text: #f6f7fa;
  --muted: #929baa;
  --cyan: #06b9dd;
  --cyan2: #079bbf;
  --radius: 22px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.app {
  display: grid;
  grid-template-columns: 350px minmax(0, 1fr);
  height: 100dvh;
  min-height: 450px;
  background: var(--bg);
}

/* SIDEBAR */

.sidebar {
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: linear-gradient(160deg, #0c0f13, #090b0e);
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 22px 17px 20px;
  scrollbar-width: thin;
  scrollbar-color: #303743 transparent;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 2px 13px 28px;
}

.brand-logo {
  width: 43px;
  height: 43px;
  border-radius: 13px;
  background: linear-gradient(145deg, #05c4e8, #079ecb);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 4px 20px #00bce51a;
}

.brand-logo svg {
  width: 27px;
  height: 27px;
}

.brand-name {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1.1px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--panel2);
  border: 1px solid transparent;
  border-radius: 30px;
  height: 55px;
  padding: 0 17px;
  margin-bottom: 24px;
  transition: border .2s;
}

.search-box:focus-within {
  border-color: #087d96;
}

.search-box svg {
  width: 23px;
  height: 23px;
  color: #a4adbd;
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 15px;
  min-width: 0;
}

.search-box input::placeholder {
  color: var(--muted);
}

.menu {
  display: grid;
  gap: 6px;
}

.menu-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 17px;
  height: 57px;
  padding: 0 20px;
  background: transparent;
  border: none;
  border-radius: 24px;
  text-align: left;
  color: #a7afbd;
  font-size: 16px;
  font-weight: 600;
  transition: background .2s, color .2s;
}

.menu-item svg {
  width: 23px;
  height: 23px;
  flex-shrink: 0;
}

.menu-item:hover {
  background: #171c24;
  color: white;
}

.menu-item.active {
  color: white;
  background: linear-gradient(110deg, #262d37, #202630);
}

.menu-item.active svg {
  color: white;
}

.section {
  border-top: 1px solid var(--border);
  margin-top: 21px;
  padding-top: 22px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 13px;
  margin-bottom: 18px;
  font-size: 17px;
  font-weight: 650;
}

.section-heading button {
  border: none;
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
  padding: 3px;
}

.section-heading svg {
  width: 21px;
  height: 21px;
}

.status-add {
  display: flex;
  align-items: center;
  gap: 13px;
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
  border-radius: 16px;
  padding: 9px 12px;
}

.status-add:hover {
  background: #151a22;
}

.add-circle {
  width: 53px;
  height: 53px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #1c222c;
  display: grid;
  place-items: center;
  color: #bac3d2;
}

.add-circle svg {
  width: 25px;
  height: 25px;
}

.status-copy strong,
.status-copy small {
  display: block;
}

.status-copy strong {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 5px;
}

.status-copy small {
  font-size: 12px;
  color: var(--muted);
}

.status-list,
.friend-list {
  display: grid;
  gap: 8px;
}

.status-person,
.friend-person {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  border: none;
  border-radius: 14px;
  background: transparent;
  padding: 9px 12px;
  text-align: left;
}

.status-person:hover,
.friend-person:hover {
  background: #171c24;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #202630;
  color: #aab5c7;
  font-weight: 700;
  font-size: 15px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-info strong,
.person-info small {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.person-info strong {
  font-size: 14px;
  font-weight: 600;
}

.person-info small {
  color: var(--muted);
  margin-top: 5px;
  font-size: 12px;
}

.empty-friends {
  text-align: center;
  padding: 28px 15px 22px;
  color: var(--muted);
}

.empty-friends-icon {
  width: 76px;
  height: 76px;
  display: grid;
  place-items: center;
  margin: 0 auto 17px;
  border-radius: 50%;
  background: #171c24;
}

.empty-friends-icon svg {
  width: 39px;
  height: 39px;
  stroke: #909bad;
}

.empty-friends strong {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: #b2bac8;
  margin-bottom: 9px;
}

.empty-friends p {
  font-size: 12px;
  line-height: 1.7;
  max-width: 220px;
  margin: auto;
}

.sidebar-bottom {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--border);
  background: #0b0d11;
  padding: 15px 5px 13px;
  flex-shrink: 0;
}

.bottom-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 60px;
  background: transparent;
  border: none;
  color: #929bad;
  font-size: 11px;
}

.bottom-link svg {
  width: 22px;
  height: 22px;
}

.bottom-link.active,
.bottom-link:hover {
  color: white;
}

/* MAIN CHAT */

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background:
    radial-gradient(ellipse at 70% 40%, #11151c22, transparent 55%),
    #080a0d;
}

.topbar {
  height: 79px;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.mobile-brand {
  display: none;
}

.topbar h1 {
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -.7px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: none;
  background: transparent;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #e1e5ed;
}

.icon-btn:hover {
  background: #1a2029;
}

.icon-btn svg {
  width: 24px;
  height: 24px;
}

.mobile-back {
  display: none;
}

.chat-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}

.empty-chat {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 35px 20px;
  text-align: center;
}

.chat-art {
  width: 155px;
  height: 145px;
  position: relative;
  margin-bottom: 20px;
}

.bubble-art {
  position: absolute;
  border-radius: 45% 45% 45% 12%;
  background: linear-gradient(145deg, #303744, #151a22);
  display: grid;
  place-items: center;
}

.bubble-art.back {
  width: 108px;
  height: 105px;
  top: 0;
  left: 10px;
  transform: rotate(-5deg);
}

.bubble-art.front {
  width: 108px;
  height: 94px;
  right: 0;
  bottom: 4px;
  border-radius: 42% 42% 12% 42%;
  border: 1px solid #3c4554;
}

.dots {
  display: flex;
  gap: 9px;
}

.dots i {
  width: 11px;
  height: 11px;
  background: #8792a5;
  border-radius: 50%;
}

.empty-chat h2 {
  font-size: 24px;
  letter-spacing: -.5px;
  margin-bottom: 13px;
}

.empty-chat p {
  font-size: 15px;
  line-height: 1.65;
  color: var(--muted);
  max-width: 360px;
}

.messages {
  padding: 24px clamp(14px, 5%, 60px);
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.message {
  align-self: flex-end;
  max-width: min(78%, 470px);
  min-width: 65px;
  background: #087e9b;
  padding: 12px 15px 8px;
  border-radius: 17px 17px 4px 17px;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.55;
}

.message-time {
  font-size: 10px;
  text-align: right;
  margin-top: 5px;
  color: #d5edf3;
}

.message.attachment {
  background: #18212b;
  border: 1px solid #2c3947;
}

.message.attachment .message-time {
  color: #9eacbd;
}

.message-file {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 5px;
}

.message-file-icon {
  width: 41px;
  height: 41px;
  border-radius: 12px;
  background: #283342;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.message-file-icon svg {
  width: 22px;
  height: 22px;
}

.message-file-name {
  font-size: 13px;
  font-weight: 600;
}

.message-file-type {
  font-size: 11px;
  color: #9da9bb;
  margin-top: 4px;
}

.message-media {
  display: block;
  max-width: 100%;
  max-height: 300px;
  border-radius: 11px;
  margin-bottom: 8px;
}

.message audio {
  max-width: 100%;
  width: 280px;
}

.message-download {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
  text-decoration: none;
  color: #bceeff;
  font-size: 12px;
}

/* COMPOSER */

.composer-wrap {
  padding: 0 17px 18px;
  flex-shrink: 0;
}

.composer {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 61px;
  padding: 7px 9px;
  border: 1px solid #292f39;
  border-radius: 35px;
  background: linear-gradient(115deg, #171c24, #11151b);
}

.composer textarea {
  resize: none;
  min-width: 0;
  flex: 1;
  max-height: 110px;
  padding: 11px 2px;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  font-size: 15px;
  line-height: 1.5;
}

.composer textarea::placeholder {
  color: #8c97a9;
}

.send-btn {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 50%;
  background: #28303b;
  color: white;
  transition: background .2s;
}

.send-btn:hover {
  background: var(--cyan2);
}

.send-btn svg {
  width: 22px;
  height: 22px;
}

.attachments {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-top: 9px;
  padding: 13px 8px 12px;
  border-radius: 26px;
  background: linear-gradient(120deg, #101318, #0c0f13);
}

.attach-btn {
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 7px;
  padding: 2px 0 3px;
  border: none;
  background: transparent;
  min-width: 0;
}

.attach-icon {
  width: 54px;
  height: 54px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #202733, #171c24);
  color: #aeb9ca;
  border: 1px solid #222a35;
  transition: background .2s, color .2s;
}

.attach-btn:hover .attach-icon {
  background: #153744;
  color: #55dfff;
}

.attach-icon svg {
  width: 24px;
  height: 24px;
}

.attach-btn strong {
  font-size: 12px;
  font-weight: 550;
}

.attach-btn small {
  color: #8994a6;
  font-size: 10px;
  text-align: center;
  overflow-wrap: anywhere;
}

.hidden-input {
  display: none;
}

/* PROFIL DAN HALAMAN LAIN */

.page-view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 30px;
}

.page-card {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 26px;
  background: #10141a;
  border: 1px solid var(--border);
  border-radius: 24px;
}

.page-card h2 {
  font-size: 22px;
  margin-bottom: 9px;
}

.page-subtitle {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 25px;
}

.profile-photo-area {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 25px;
}

.profile-photo {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #202630;
  overflow: hidden;
  display: grid;
  place-items: center;
  color: #aeb8c8;
  flex-shrink: 0;
}

.profile-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-photo svg {
  width: 39px;
  height: 39px;
}

.upload-label {
  display: inline-flex;
  padding: 10px 14px;
  background: #1e2630;
  border: 1px solid #303a48;
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
}

.upload-help {
  color: var(--muted);
  font-size: 11px;
  margin-top: 9px;
}

.field {
  margin-bottom: 19px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 9px;
}

.field input {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  background: #0b0e13;
  color: white;
  border: 1px solid #29303a;
  outline: none;
}

.field input:focus {
  border-color: #0785a1;
}

.primary-btn {
  border: none;
  border-radius: 13px;
  background: #06a9cc;
  color: white;
  font-size: 14px;
  font-weight: 650;
  padding: 14px 18px;
  width: 100%;
}

.primary-btn:hover {
  background: #078ba8;
}

.secondary-btn {
  border: 1px solid #343c49;
  background: #1a2029;
  color: white;
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 13px;
}

.notice {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  margin-top: 18px;
}

.page-empty {
  flex: 1;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}

.page-empty .empty-friends-icon {
  width: 90px;
  height: 90px;
}

.page-empty h2 {
  font-size: 22px;
  margin-bottom: 10px;
}

.page-empty p {
  color: var(--muted);
  max-width: 360px;
  line-height: 1.7;
  font-size: 14px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translate(-50%, 15px);
  background: #202731;
  border: 1px solid #37414f;
  color: white;
  border-radius: 14px;
  padding: 13px 18px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 20;
  max-width: calc(100vw - 32px);
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (min-width: 1400px) {
  .app {
    grid-template-columns: 360px minmax(0, 1fr);
  }
}

@media (max-width: 800px) {
  .app {
    grid-template-columns: 290px minmax(0, 1fr);
  }

  .sidebar-scroll {
    padding-left: 12px;
    padding-right: 12px;
  }

  .brand {
    margin-left: 8px;
  }

  .topbar {
    padding: 0 15px;
  }

  .composer-wrap {
    padding: 0 10px 12px;
  }

  .attach-icon {
    width: 45px;
    height: 45px;
  }
}

@media (max-width: 560px) {
  body {
    overflow: hidden;
  }

  .app {
    display: block;
    position: relative;
    height: 100dvh;
    min-height: 0;
  }

  .sidebar {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    border-right: none;
    display: flex;
  }

  .main {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .app.chat-open .sidebar {
    display: none;
  }

  .app.chat-open .main {
    display: flex;
  }

  .sidebar-scroll {
    padding: 16px 14px 18px;
  }

  .brand {
    margin: 0 6px 20px;
  }

  .brand-logo {
    width: 39px;
    height: 39px;
    border-radius: 12px;
  }

  .brand-name {
    font-size: 25px;
  }

  .search-box {
    height: 49px;
    margin-bottom: 17px;
  }

  .menu-item {
    height: 49px;
    border-radius: 17px;
  }

  .section {
    margin-top: 16px;
    padding-top: 17px;
  }

  .topbar {
    height: 65px;
    padding: 0 10px;
    gap: 5px;
  }

  .topbar h1 {
    font-size: 20px;
  }

  .topbar-actions {
    gap: 1px;
  }

  .icon-btn {
    width: 37px;
    height: 37px;
  }

  .mobile-back {
    display: grid;
    width: 35px;
  }

  .mobile-brand {
    display: grid;
    place-items: center;
    width: 31px;
    height: 31px;
    border-radius: 9px;
    background: #08b8d8;
    flex-shrink: 0;
  }

  .mobile-brand svg {
    width: 22px;
    height: 22px;
  }

  .empty-chat {
    padding: 20px 15px;
  }

  .chat-art {
    transform: scale(.82);
    margin-top: -8px;
    margin-bottom: 6px;
  }

  .empty-chat h2 {
    font-size: 21px;
  }

  .empty-chat p {
    font-size: 13px;
  }

  .messages {
    padding: 16px 12px;
  }

  .composer-wrap {
    padding: 0 8px max(8px, env(safe-area-inset-bottom));
  }

  .composer {
    min-height: 53px;
    padding: 5px 7px 5px 12px;
  }

  .composer textarea {
    font-size: 14px;
    padding: 8px 0;
  }

  .send-btn {
    width: 39px;
    height: 39px;
  }

  .attachments {
    gap: 2px;
    padding: 9px 3px 7px;
    border-radius: 20px;
    margin-top: 7px;
  }

  .attach-btn {
    gap: 5px;
  }

  .attach-icon {
    width: 40px;
    height: 40px;
    border-radius: 13px;
  }

  .attach-icon svg {
    width: 20px;
    height: 20px;
  }

  .attach-btn strong {
    font-size: 10px;
  }

  .attach-btn small {
    font-size: 9px;
  }

  .page-view {
    padding: 18px 12px;
  }

  .page-card {
    padding: 20px 16px;
  }
}

@media (max-height: 600px) {
  .sidebar-scroll {
    padding-top: 10px;
  }

  .brand {
    margin-bottom: 12px;
  }

  .search-box {

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = (selector) => document.querySelector(selector);

const app = $("#app");
const pageTitle = $("#pageTitle");
const chatArea = $("#chatArea");
const emptyChat = $("#emptyChat");
const messages = $("#messages");
const composerWrap = $("#composerWrap");
const pageView = $("#pageView");
const messageInput = $("#messageInput");
const searchInput = $("#searchInput");
const toast = $("#toast");

let currentPage = "chat";
let currentChat = null;
let toastTimer = null;
let profilePhotoData = "";
let statusItems = [];

/*
  Data kontak sengaja dikosongkan terlebih dahulu.
  Daftar teman dan pesan asli membutuhkan sistem akun,
  database, serta server/backend.
*/

let friends = [];

const pageNames = {
  chat: "Chat",
  status: "Status",
  friends: "Teman",
  notifications: "Notifikasi",
  profile: "Profil"
};

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function initials(name) {
  return String(name || "OER")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(part => part[0] || "")
    .join("")
    .toUpperCase();
}

function avatarHTML(person, extraClass = "") {
  const photo = person.photo
    ? `<img src="${escapeHTML(person.photo)}" alt="">`
    : `<span>${escapeHTML(initials(person.name))}</span>`;

  return `<div class="avatar ${extraClass}">${photo}</div>`;
}

function renderFriends(filter = "") {
  const query = filter.trim().toLowerCase();

  const results = friends.filter(friend =>
    friend.name.toLowerCase().includes(query)
  );

  $("#friendList").innerHTML = results.map(friend => `
    <button class="friend-person" data-friend-id="${escapeHTML(friend.id)}">
      ${avatarHTML(friend)}
      <span class="person-info">
        <strong>${escapeHTML(friend.name)}</strong>
        <small>${escapeHTML(friend.lastMessage || "Mulai percakapan")}</small>
      </span>
    </button>
  `).join("");

  $("#emptyFriends").hidden = results.length > 0;

  if (query && results.length === 0) {
    $("#emptyFriends").querySelector("strong").textContent =
      "Teman tidak ditemukan";
    $("#emptyFriends").querySelector("p").textContent =
      "Coba kata pencarian lain.";
  } else {
    $("#emptyFriends").querySelector("strong").textContent =
      "Belum ada teman chat";
    $("#emptyFriends").querySelector("p").textContent =
      "Tambahkan teman untuk mulai mengobrol di sini.";
  }
}

function renderStatuses() {
  $("#statusList").innerHTML = statusItems.map(item => `
    <button class="status-person" data-status-id="${escapeHTML(item.id)}">
      ${avatarHTML(item)}
      <span class="person-info">
        <strong>${escapeHTML(item.name)}</strong>
        <small>${escapeHTML(item.text || "Status terbaru")}</small>
      </span>
    </button>
  `).join("");
}

function setPage(page) {
  currentPage = page;
  currentChat = null;

  document.querySelectorAll("[data-page]").forEach(button => {
    const active = button.dataset.page === page;
    button.classList.toggle("active", active);
  });

  pageTitle.textContent = pageNames[page] || "OER";
  pageView.hidden = true;
  chatArea.hidden = false;
  composerWrap.hidden = false;

  $("#emptyChat").hidden = false;
  messages.hidden = true;
  messages.innerHTML = "";

  if (page === "chat") {
    $("#emptyTitle").textContent = "Mulai Percakapan";
    $("#emptyDescription").textContent =
      "Pilih teman dari daftar di samping untuk mulai chat.";

    if (window.innerWidth <= 560) {
      app.classList.remove("chat-open");
    }
    return;
  }

  chatArea.hidden = true;
  composerWrap.hidden = true;
  pageView.hidden = false;

  if (page === "profile") {
    renderProfilePage();
  } else if (page === "friends") {
    renderFriendsPage();
  } else if (page === "status") {
    renderStatusPage();
  } else if (page === "notifications") {
    renderNotificationsPage();
  }
}

function openChat(friendId) {
  const friend = friends.find(item => item.id === friendId);
  if (!friend) return;

  currentChat = friend;
  currentPage = "chat";
  pageTitle.textContent = friend.name;

  pageView.hidden = true;
  chatArea.hidden = false;
  composerWrap.hidden = false;
  emptyChat.hidden = true;
  messages.hidden = false;

  messages.innerHTML = "";

  (friend.messages || []).forEach(message => {
    renderMessage(message);
  });

  app.classList.add("chat-open");
  messageInput.focus();
}

function renderMessage(message) {
  const article = document.createElement("article");
  article.className = "message";

  if (message.file) {
    article.classList.add("attachment");

    const file = message.file;
    const type = file.type || "";
    const url = file.url;

    if (type.startsWith("image/") && url) {
      const image = document.createElement("img");
      image.src = url;
      image.alt = file.name;
      image.className = "message-media";
      article.appendChild(image);
    } else if (type.startsWith("video/") && url) {
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      video.className = "message-media";
      article.appendChild(video);
    } else if (type.startsWith("audio/") && url) {
      const audio = document.createElement("audio");
      audio.src = url;
      audio.controls = true;
      article.appendChild(audio);
    } else {
      const fileRow = document.createElement("div");
      fileRow.className = "message-file";

      const icon = document.createElement("div");
      icon.className = "message-file-icon";
      icon.textContent = "↗";

      const info = document.createElement("div");
      const name = document.createElement("div");
      name.className = "message-file-name";
      name.textContent = file.name;

      const size = document.createElement("div");
      size.className = "message-file-type";
      size.textContent = formatSize(file.size);

      info.append(name, size);
      fileRow.append(icon, info);
      article.appendChild(fileRow);
    }

    if (url) {
      const download = document.createElement("a");
      download.className = "message-download";
      download.href = url;
      download.download = file.name;
      download.textContent = "Unduh file";
      article.appendChild(download);
    }
  }

  if (message.text) {
    const text = document.createElement("div");
    text.textContent = message.text;
    article.appendChild(text);
  }

  const time = document.createElement("div");
  time.className = "message-time";
  time.textContent = message.time || getTime();
  article.appendChild(time);

  messages.appendChild(article);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function getTime() {
  return new Date().toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatSize(bytes) {
  if (!bytes) return "File";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) {
    return (bytes / 1024).toFixed(1) + " KB";
  }
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function sendTextMessage(text) {
  const cleanText = text.trim();
  if (!cleanText) return;

  if (!currentChat) {
    showToast("Pilih teman chat terlebih dahulu.");
    return;
  }

  const message = { text: cleanText, time: getTime() };
  currentChat.messages ||= [];
  currentChat.messages.push(message);
  currentChat.lastMessage = cleanText;

  renderMessage(message);
  renderFriends(searchInput.value);
}

$("#messageForm").addEventListener("submit", event => {
  event.preventDefault();
  const text = messageInput.value;
  if (!text.trim()) return;

  sendTextMessage(text);
  messageInput.value = "";
  messageInput.style.height = "auto";
});

messageInput.addEventListener("input", () => {
  messageInput.style.height = "auto";
  messageInput.style.height =
    Math.min(messageInput.scrollHeight, 110) + "px";
});

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("#messageForm").requestSubmit();
  }
});

/*
  Lampiran bekerja sebagai pratinjau lokal.
  File belum terkirim ke perangkat orang lain karena
  fitur tersebut membutuhkan server/backend.
*/

document.querySelectorAll("[data-file]").forEach(button => {
  button.addEventListener("click", () => {
    if (!currentChat) {
      showToast("Pilih teman chat terlebih dahulu.");
      return;
    }

    $("#" + button.dataset.file).click();
  });
});

const MAX_FILE_SIZE = 100 * 1024 * 1024;

["appFile", "videoFile", "photoFile", "musicFile",
 "documentFile"].forEach(inputId => {
  $("#" + inputId).addEventListener("change", event => {
    const input = event.target;
    const file = input.files && input.files[0];
    if (!file) return;

    if (!currentChat) {
      showToast("Pilih teman chat terlebih dahulu.");
      input.value = "";
      return;
    }

    if (file.size > MAX_FILE_SIZE) {
      showToast("Ukuran file maksimal 100 MB.");
      input.value = "";
      return;
    }

    const isApp = inputId === "appFile";
    const isPhoto = inputId === "photoFile";
    const isVideo = inputId === "videoFile";
    const isMusic = inputId === "musicFile";

    if (isApp && !/\.(apk|aab|ipa|exe|msi|dmg|zip)$/i.test(file.name)) {
      showToast("Pilih file aplikasi yang didukung.");
      input.value = "";
      return;
    }

    if (isPhoto && !file.type.startsWith("image/")) {
      showToast("Pilih file gambar yang valid.");
      input.value = "";
      return;
    }

    if (isVideo && !file.type.startsWith("video/")) {
      showToast("Pilih file video yang valid.");
      input.value = "";
      return;
    }

    if (isMusic && !file.type.startsWith("audio/")) {
      showToast("Pilih file musik yang valid.");
      input.value = "";
      return;
    }

    const url = URL.createObjectURL(file);

    const message = {
      time: getTime(),
      text: "",
      file: {
        name: file.name,
        size: file.size,
        type: file.type || "",
        url: url
      }
    };

    currentChat.messages ||= [];
    currentChat.messages.push(message);

    renderMessage(message);
    currentChat.lastMessage = file.name;
    renderFriends(searchInput.value);

    showToast("Pratinjau file ditambahkan ke chat.");
    input.value = "";
  });
});

/* PENCARIAN TEMAN */

searchInput.addEventListener("input", () => {
  renderFriends(searchInput.value);
});

$("#topSearchBtn").addEventListener("click", () => {
  if (window.innerWidth <= 560 && currentPage === "chat") {
    app.classList.remove("chat-open");
  }

  searchInput.focus();
  searchInput.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

$("#backButton").addEventListener("click", () => {
  app.classList.remove("chat-open");
  currentChat = null;
  pageTitle.textContent = "Chat";
});

/* PROFIL */

function renderProfilePage() {
  pageView.innerHTML = `
    <div class="page-card">
      <h2>Profil OER</h2>
      <p class="page-subtitle">
        Atur foto profil, nama, dan nomor WhatsApp kamu.
      </p>

      <div class="profile-photo-area">
        <div class="profile-photo" id="profilePreview">
          ${profilePhotoData
            ? `<img src="${escapeHTML(profilePhotoData)}" alt="Foto profil">`
            : `<svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
              </svg>`}
        </div>
        <div>
          <label class="upload-label" for="profilePhotoInput">
            Upload Foto JPG
          </label>
          <input class="hidden-input" id="profilePhotoInput"
            type="file" accept=".jpg,.jpeg,image/jpeg">
          <p class="upload-help">JPG/JPEG, maksimal 5 MB.</p>
        </div>
      </div>

      <form id="profileForm">
        <div class="field">
          <label for="profileName">Nama</label>
          <input id="profileName" maxlength="60"
            placeholder="Masukkan nama kamu" required>
        </div>

        <div class="field">
          <label for="profileWA">Nomor WhatsApp</label>
          <input id="profileWA" type="tel" maxlength="20"
            placeholder="Contoh: 081234567890">
        </div>

        <button class="primary-btn" type="submit">Simpan Profil</button>
      </form>

      <p class="notice">
        Profil ini disimpan di browser perangkat ini.
        Untuk menampilkan profil ke pengguna lain, OER memerlukan
        sistem akun dan server.
      </p>
    </div>
  `;

  const saved = getSavedProfile();
  $("#profileName").value = saved.name || "";
  $("#profileWA").value = saved.whatsapp || "";

  $("#profilePhotoInput").addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file) return;

    if (!["image/jpeg"].includes(file.type)) {
      showToast("Gunakan foto berformat JPG/JPEG.");
      event.target.value = "";
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      showToast("Ukuran foto maksimal 5 MB.");
      event.target.value = "";
      return;
    }

    try {
      profilePhotoData = await fileToDataURL(file);
      $("#profilePreview").innerHTML =
        `<img src="${profilePhotoData}" alt="Foto profil">`;
      showToast("Foto profil berhasil dipilih.");
    } catch {
      showToast("Foto tidak dapat dibaca.");
    }
  });

  $("#profileForm").addEventListener("submit", event => {
    event.preventDefault();

    const data = {
      name: $("#profileName").value.trim(),
      whatsapp: $("#profileWA").value.trim(),
      photo: profilePhotoData
    };

    try {
      localStorage.setItem("oer_profile", JSON.stringify(data));
      showToast("Profil berhasil disimpan.");
    } catch {
      showToast("Penyimpanan penuh. Gunakan foto lebih kecil.");
    }
  });
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getSavedProfile() {
  try {
    return JSON.parse(localStorage.getItem("oer_profile") || "{}");
  } catch {
    return {};
  }
}

function renderFriendsPage() {
  pageView.innerHTML = `
    <div class="page-empty">
      <div class="empty-friends-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8">
          <circle cx="9" cy="7" r="3.5"/>
          <path d="M2 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/>
          <path d="M16 4a3.5 3.5 0 0 1 0 7"/>
        </svg>
      </div>
      <h2>Teman OER</h2>
      <p>Daftar teman masih kosong. Fitur pencarian dan penambahan
        teman dapat dihubungkan ke sistem akun OER.</p>
    </div>
  `;
}

function renderStatusPage() {
  pageView.innerHTML = `
    <div class="page-card">
      <h2>Status OER</h2>
      <p class="page-subtitle">
        Bagikan momen dan lihat status teman.
      </p>
      <button class="primary-btn" id="createStatus">
        + Buat Status
      </button>
      <div id="statusPageList" style="margin-top:20px"></div>
    </div>
  `;

  const list = $("#statusPageList");

  if (statusItems.length === 0) {
    list.innerHTML = `
      <p class="notice">Belum ada status. Status yang kamu buat
      akan muncul di halaman ini selama halaman masih terbuka.</p>
    `;
  } else {
    list.innerHTML = statusItems.map(item => `
      <div class="friend-person">
        ${avatarHTML(item)}
        <span class="person-info">
          <strong>${escapeHTML(item.name)}</strong>
          <small>${escapeHTML(item.text)}</small>
        </span>
      </div>
    `).join("");
  }

  $("#createStatus").addEventListener("click", createStatus);
}

function createStatus() {
  const profile = getSavedProfile();
  const text = prompt("Tulis status kamu:");

  if (text === null || !text.trim()) return;

  statusItems.unshift({
    id: String(Date.now()),
    name: profile.name || "Saya",
    photo: profile.photo || "",
    text: text.trim()
  });

  renderStatuses();

  if (currentPage === "status") renderStatusPage();
  showToast("Status ditambahkan.");
}

$("#addStatus").addEventListener("click", createStatus);

function renderNotificationsPage() {
  pageView.innerHTML = `
    <div class="page-empty">
      <div class="empty-friends-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>
      </div>
      <h2>Notifikasi</h2>
      <p>Belum ada notifikasi.</p>
    </div>
  `;
}
  
/* Inisialisasi */
renderFriends();
renderStatuses();
setPage("chat");
