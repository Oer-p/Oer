<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070a">
<title>OER — Chat</title>
<style>
:root {
  --bg: #05070a;
  --panel: #0b0f14;
  --panel2: #11161d;
  --panel3: #171d26;
  --border: #1e2630;
  --text: #f1f5f9;
  --muted: #8b97a8;
  --cyan: #00a8e8;
  --cyan-dim: #0088c2;
  --cyan-glow: rgba(0, 168, 232, 0.15);
  --radius: 16px;
  --radius-sm: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

.app {
  display: grid;
  grid-template-columns: 280px 320px 1fr;
  height: 100dvh;
}
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100%;
}
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 20px 14px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 24px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 13px;
  background: var(--cyan); display: grid; place-items: center;
  box-shadow: 0 0 20px var(--cyan-glow);
}
.brand-logo svg { width: 24px; height: 24px; }
.brand-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.brand-tag { font-size: 9px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 1px; }

.nav { display: grid; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  height: 46px; padding: 0 14px; border-radius: 12px;
  color: var(--muted); font-size: 14px; font-weight: 600;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item:hover { background: var(--panel2); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(0,168,232,0.15), rgba(0,168,232,0.05));
  color: var(--cyan); border: 1px solid rgba(0,168,232,0.2);
}

.list-panel {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.list-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
.list-head h1 { font-size: 20px; font-weight: 750; margin-bottom: 14px; }
.search {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 12px; height: 42px; padding: 0 12px;
}
.search:focus-within { border-color: var(--cyan); }
.search input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 13px; min-width: 0;
}
.search input::placeholder { color: var(--muted); }

.chat-list { flex: 1; overflow-y: auto; padding: 8px; }
.chat-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 14px; width: 100%; text-align: left;
  border: 1px solid transparent;
}
.chat-item:hover, .chat-item.active {
  background: var(--panel2); border-color: var(--border);
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--panel3); display: grid; place-items: center;
  font-weight: 700; font-size: 15px; color: var(--cyan); flex-shrink: 0;
}
.chat-info { min-width: 0; flex: 1; }
.chat-name { font-size: 14px; font-weight: 650; }
.chat-last {
  font-size: 12px; color: var(--muted); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-time { font-size: 11px; color: var(--muted); }

.empty-list {
  text-align: center; padding: 40px 20px; color: var(--muted);
}
.empty-list .icon {
  width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 18px;
  background: var(--panel2); display: grid; place-items: center; font-size: 24px;
}

.chat-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-top {
  height: 64px; display: flex; align-items: center; gap: 12px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
  background: rgba(11,15,20,0.85); backdrop-filter: blur(10px);
}
.chat-top .avatar { width: 40px; height: 40px; font-size: 14px; }
.chat-user { flex: 1; min-width: 0; }
.chat-user strong { display: block; font-size: 15px; }
.chat-user small { font-size: 12px; color: var(--muted); }

.messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 10px;
}
.welcome {
  margin: auto; text-align: center; max-width: 360px; padding: 30px;
}
.welcome-logo {
  width: 72px; height: 72px; border-radius: 22px; background: var(--cyan);
  display: grid; place-items: center; margin: 0 auto 20px;
  box-shadow: 0 0 40px var(--cyan-glow);
}
.welcome-logo svg { width: 40px; height: 40px; }
.welcome h2 { font-size: 22px; margin-bottom: 8px; }
.welcome p { color: var(--muted); font-size: 13px; line-height: 1.7; }

.bubble {
  max-width: min(75%, 480px); padding: 11px 14px;
  border-radius: 16px; font-size: 14px; line-height: 1.5;
  overflow-wrap: anywhere;
}
.bubble.mine {
  align-self: flex-end;
  background: linear-gradient(135deg, #0088c2, #00a8e8);
  border-bottom-right-radius: 4px;
}
.bubble.theirs {
  align-self: flex-start;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.bubble small {
  display: block; text-align: right; font-size: 10px;
  margin-top: 5px; opacity: 0.8;
}
.bubble img, .bubble video {
  max-width: 100%; max-height: 280px; border-radius: 10px; margin-top: 6px;
}
.bubble a { color: #c8f0ff; font-size: 12px; display: inline-block; margin-top: 6px; }

.composer-wrap {
  padding: 12px 16px; border-top: 1px solid var(--border);
  background: var(--panel);
}
.attach-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
}
.attach {
  padding: 7px 11px; border-radius: 10px;
  background: var(--panel2); border: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}
.attach:hover { color: var(--cyan); border-color: var(--cyan); }
.compose {
  display: flex; align-items: center; gap: 10px;
}
.compose input {
  flex: 1; height: 46px; padding: 0 16px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 14px; color: var(--text); outline: none;
}
.compose input:focus { border-color: var(--cyan); }
.send {
  height: 46px; padding: 0 20px; border-radius: 14px;
  background: var(--cyan); color: #001018; font-weight: 700;
}
.send:disabled { opacity: 0.5; cursor: not-allowed; }
.file-input { display: none; }

.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 64px; background: var(--panel); border-top: 1px solid var(--border);
  grid-template-columns: repeat(4, 1fr); z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 10px; color: var(--muted); font-weight: 600;
}
.bottom-nav a.active { color: var(--cyan); }
.bottom-nav svg { width: 22px; height: 22px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .list-panel { display: flex; }
  .chat-panel { display: none; }
  .app.chat-open .list-panel { display: none; }
  .app.chat-open .chat-panel { display: flex; }
  .bottom-nav { display: grid; }
  .chat-panel { padding-bottom: 64px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-scroll">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 48 48" fill="none"><path d="M24 6C13.5 6 5 13.1 5 22c0 5.1 2.9 9.7 7.4 12.6L10 42l11-5.1c1 .2 2 .3 3 .3 10.5 0 19-7.1 19-16S34.5 6 24 6Z" fill="white"/></svg>
        </div>
        <div>
          <div class="brand-name">OER</div>
          <div class="brand-tag">Connect Everything</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Beranda</a>
        <a class="nav-item active" href="chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>Chat</a>
        <a class="nav-item" href="status.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg>Status</a>
        <a class="nav-item" href="friends.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Teman</a>
      </nav>
    </div>
  </aside>

  <section class="list-panel">
    <div class="list-head">
      <h1>Pesan</h1>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="Cari percakapan...">
      </div>
    </div>
    <div class="chat-list" id="friendList">
      <div class="empty-list">
        <div class="icon">💬</div>
        <strong style="color:var(--text)">Belum ada percakapan</strong>
        <p style="margin-top:8px;font-size:13px">Tekan + untuk membuat chat baru</p>
      </div>
    </div>
    <div style="padding:12px 14px;border-top:1px solid var(--border)">
      <button id="newChat" style="width:100%;height:44px;border-radius:12px;background:var(--cyan);color:#001018;font-weight:700;font-size:14px">+ Buat Percakapan</button>
    </div>
  </section>

  <main class="chat-panel">
    <header class="chat-top">
      <button id="backBtn" style="display:none;width:36px;height:36px;border-radius:10px;background:var(--panel2)">‹</button>
      <div class="avatar" id="chatAvatar">O</div>
      <div class="chat-user">
        <strong id="chatTitle">OER Chat</strong>
        <small id="chatSubtitle">Pilih percakapan untuk mulai</small>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome">
        <div class="welcome-logo">
          <svg viewBox="0 0 48 48" fill="none"><path d="M24 6C13.5 6 5 13.1 5 22c0 5.1 2.9 9.7 7.4 12.6L10 42l11-5.1c1 .2 2 .3 3 .3 10.5 0 19-7.1 19-16S34.5 6 24 6Z" fill="white"/></svg>
        </div>
        <h2>Semua koneksi, satu tempat</h2>
        <p>Mulai percakapan, kirim pesan, foto, video, musik, atau file APK.</p>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="attach-row">
        <button class="attach" data-file="photo">Foto</button>
        <button class="attach" data-file="video">Video</button>
        <button class="attach" data-file="audio">Musik</button>
        <button class="attach" data-file="apk">APK</button>
        <button class="attach" data-file="other">File</button>
      </div>
      <div class="compose">
        <input type="text" id="messageInput" placeholder="Tulis pesan..." disabled>
        <button class="send" id="sendBtn" disabled>Kirim</button>
      </div>
      <input class="file-input" type="file" id="filePicker">
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Home</a>
  <a href="chat.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>Chat</a>
  <a href="status.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg>Status</a>
  <a href="friends.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Teman</a>
</nav>

<script>
const app = document.getElementById('app');
const messages = document.getElementById('messages');
const input = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const filePicker = document.getElementById('filePicker');
const DB_NAME = 'OER_CHAT_V3';
const STORE = 'chats';
let db = null, activeChat = null, chats = [], objectUrls = [];

const typeAccept = {
  photo: 'image/*', video: 'video/mp4,.mp4', audio: 'audio/mpeg,.mp3',
  apk: '.apk', other: '*/*'
};

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function saveChats() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(chats, 'list');
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
function loadChats() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get('list');
    req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
    req.onerror = () => reject(req.error);
  });
}
function timeNow() {
  return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}
function formatBytes(s) {
  if (s < 1024) return s + ' B';
  if (s < 1048576) return (s/1024).toFixed(1) + ' KB';
  return (s/1048576).toFixed(1) + ' MB';
}
function revokeUrls() { objectUrls.forEach(u => URL.revokeObjectURL(u)); objectUrls = []; }
function createURL(blob) { const u = URL.createObjectURL(blob); objectUrls.push(u); return u; }

function renderFriends(filter = '') {
  const box = document.getElementById('friendList');
  const q = filter.trim().toLowerCase();
  const filtered = chats.filter(c => !q || c.name.toLowerCase().includes(q) || (c.last||'').toLowerCase().includes(q));
  if (!filtered.length) {
    box.innerHTML = `<div class="empty-list"><div class="icon">💬</div><strong style="color:var(--text)">${q?'Tidak ditemukan':'Belum ada percakapan'}</strong></div>`;
    return;
  }
  box.innerHTML = '';
  filtered.forEach(chat => {
    const btn = document.createElement('button');
    btn.className = 'chat-item' + (activeChat === chat.id ? ' active' : '');
    btn.innerHTML = `<div class="avatar">${chat.name[0].toUpperCase()}</div>
      <div class="chat-info"><div class="chat-name">\( {chat.name}</div><div class="chat-last"> \){chat.last || 'Mulai percakapan'}</div></div>
      <span class="chat-time">${chat.time || ''}</span>`;
    btn.onclick = () => openChat(chat.id);
    box.appendChild(btn);
  });
}

function openChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  activeChat = id;
  app.classList.add('chat-open');
  document.getElementById('chatTitle').textContent = chat.name;
  document.getElementById('chatSubtitle').textContent = 'Tersimpan di perangkat ini';
  document.getElementById('chatAvatar').textContent = chat.name[0].toUpperCase();
  input.disabled = false; sendBtn.disabled = false;
  renderMessages(); renderFriends(document.getElementById('search').value);
}

function renderMessages() {
  revokeUrls();
  const chat = chats.find(c => c.id === activeChat);
  messages.innerHTML = '';
  if (!chat || !chat.messages.length) {
    messages.innerHTML = `<div class="welcome"><div class="welcome-logo"><svg viewBox="0 0 48 48" fill="none"><path d="M24 6C13.5 6 5 13.1 5 22c0 5.1 2.9 9.7 7.4 12.6L10 42l11-5.1c1 .2 2 .3 3 .3 10.5 0 19-7.1 19-16S34.5 6 24 6Z" fill="white"/></svg></div><h2>Mulai percakapan</h2><p>Kirim pesan pertama kamu.</p></div>`;
    return;
  }
  chat.messages.forEach(m => {
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.mine ? 'mine' : 'theirs');
    if (m.kind === 'file' && m.meta?.file instanceof Blob) {
      const url = createURL(m.meta.file);
      const type = m.meta.file.type || '';
      b.innerHTML = `<div style="font-weight:650;margin-bottom:6px">📎 \( {m.text} ( \){formatBytes(m.meta.file.size)})</div>`;
      if (type.startsWith('image/')) b.innerHTML += `<img src="${url}" alt="">`;
      else if (type.startsWith('video/')) b.innerHTML += `<video src="${url}" controls></video>`;
      else if (type.startsWith('audio/')) b.innerHTML += `<audio src="${url}" controls style="width:100%"></audio>`;
      b.innerHTML += `<a href="\( {url}" download=" \){m.text}">⬇ Unduh file</a><small>${m.time}</small>`;
    } else {
      b.innerHTML = `\( {m.text}<small> \){m.time || ''}</small>`;
    }
    messages.appendChild(b);
  });
  messages.scrollTop = messages.scrollHeight;
}

async function addMessage(kind, text, meta = {}) {
  const chat = chats.find(c => c.id === activeChat);
  if (!chat) return;
  chat.messages.push({ id: Date.now(), kind, text, meta, mine: true, time: timeNow() });
  chat.last = kind === 'file' ? '📎 ' + text : text;
  chat.time = timeNow();
  renderMessages(); renderFriends();
  try { await saveChats(); } catch(e) { console.error(e); }
}

sendBtn.onclick = async () => {
  const t = input.value.trim();
  if (!t || !activeChat) return;
  input.value = '';
  await addMessage('text', t);
};
input.onkeydown = e => { if (e.key === 'Enter') sendBtn.click(); };

document.getElementById('newChat').onclick = async () => {
  const name = prompt('Nama percakapan:');
  if (!name?.trim()) return;
  const chat = { id: 'c' + Date.now(), name: name.trim(), messages: [], last: '', time: timeNow() };
  chats.unshift(chat);
  await saveChats();
  renderFriends();
  openChat(chat.id);
};

document.getElementById('search').oninput = e => renderFriends(e.target.value);
document.getElementById('backBtn').onclick = () => app.classList.remove('chat-open');
document.querySelectorAll('[data-file]').forEach(btn => {
  btn.onclick = () => {
    if (!activeChat) return alert('Pilih percakapan dulu');
    filePicker.accept = typeAccept[btn.dataset.file] || '*/*';
    filePicker.click();
  };
});
filePicker.onchange = async () => {
  const file = filePicker.files?.[0];
  if (!file) return;
  if (file.size > 100*1024*1024) return alert('Maksimal 100 MB');
  await addMessage('file', file.name, { name: file.name, size: file.size, type: file.type, file });
  filePicker.value = '';
};

(async () => {
  try {
    await openDB();
    chats = await loadChats();
    renderFriends();
    if (chats[0]) openChat(chats[0].id);
  } catch (e) {
    console.error(e);
    document.getElementById('friendList').innerHTML = '<div class="empty-list"><strong>Database tidak tersedia</strong></div>';
  }
})();
</script>
</body>
</html>
